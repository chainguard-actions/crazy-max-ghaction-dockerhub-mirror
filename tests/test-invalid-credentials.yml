name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder || true

      - name: Run action with invalid credentials (no dry-run)
        id: action
        uses: .
        with:
          dockerhub-username: bad-user
          dockerhub-password: bad-password
          dockerhub-repo: library/nginx
          dest-registry: ghcr.io
          dest-repo: test-org/nginx-mirror
          dry-run: 'false'
        continue-on-error: true

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (cannot retrieve token)"
