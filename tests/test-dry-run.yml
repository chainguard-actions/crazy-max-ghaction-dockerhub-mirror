name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        run: docker buildx create --use || true
      - id: action
        uses: .
        with:
          dockerhub-username: testuser
          dockerhub-password: testpassword
          dockerhub-repo: library/hello-world
          dest-registry: ghcr.io
          dest-repo: testorg/hello-world
          dry-run: 'true'
        continue-on-error: true
      - name: Assert action ran (dry-run with fake creds expected to fail at auth)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, the action will fail at DockerHub auth.
          # This is expected behavior — we just verify the action was invoked
          # with all required inputs and produced a known outcome (success or failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with all required inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
